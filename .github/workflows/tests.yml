name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dashboard.txt beautifulsoup4 playwright python-dotenv PyYAML tldextract

      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests
